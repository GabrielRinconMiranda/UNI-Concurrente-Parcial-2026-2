services:
  # 1. Central Backend Server (Java Orchestrator + REST API + Admin Console)
  - type: web
    name: open-ai-cubes-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.server
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: CLOUD_WORKERS
        value: "https://open-ai-cubes-go-worker.onrender.com,https://open-ai-cubes-python-worker.onrender.com,https://open-ai-cubes-cpp-worker.onrender.com,https://open-ai-cubes-rust-worker.onrender.com,https://open-ai-cubes-java-worker.onrender.com"

  # 2. Go Worker Cube (Convolutional & MLP Inference)
  - type: web
    name: open-ai-cubes-go-worker
    runtime: go
    plan: free
    rootDir: go_worker_cube
    buildCommand: go build -o worker_cube worker_cube.go micro_chunks.go
    startCommand: ./worker_cube --http

  # 3. Python Worker Cube (Convolutional & MLP Inference)
  - type: web
    name: open-ai-cubes-python-worker
    runtime: python
    plan: free
    rootDir: python_worker_cube
    buildCommand: echo "Python worker ready"
    startCommand: python worker_cube.py --http

  # 4. C++ Worker Cube with OpenMP (Convolutional & MLP Inference)
  - type: web
    name: open-ai-cubes-cpp-worker
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.cpp_worker
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080

  # 5. Rust Worker Cube (Convolutional & MLP Inference)
  - type: web
    name: open-ai-cubes-rust-worker
    runtime: rust
    plan: free
    rootDir: rust_worker_cube
    buildCommand: cargo build --release
    startCommand: ./target/release/rust_worker_cube --http

  # 6. Java Worker Cube (Convolutional & MLP Inference)
  - type: web
    name: open-ai-cubes-java-worker
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.java_worker
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080

  # 7. Static Frontend (Global Edge CDN)
  - type: web
    name: open-ai-cubes-frontend
    runtime: static
    staticPublishPath: ./web
